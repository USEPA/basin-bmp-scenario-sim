[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basin-bmp-sim"
version = "0.1.0"
description = "Watershed BMP scenario simulation model"
readme = "readme.md"
requires-python = ">=3.10"
authors = [
  { name = "USEPA" }
]
license = { text = "Apache-2.0" }
dependencies = [
  "numpy",
  "pandas>=2.2",
  "python-calamine",
  "xlsxwriter",
  "geopandas",
  "shapely",
  "pyproj",
  "matplotlib",
  "pyyaml",
  "pyarrow",
  "pytest",
  "requests",
  "rasterio",
  "pyogrio",
  "fiona",
]

[project.optional-dependencies]
# For the WhiteboxTools D8 parcel-connectivity builder.
hydrology = ["whitebox>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.setuptools.package-data]
src = ["data/afo/manure_excretion_reference.csv"]
