pollutants: [TN, TP, TSS]
cps: [313, 590]
feedlot_bmp_cps: [313]
load_generation:
  mode: plet_rusle
n_scenarios: 2
bmp_limit_n: 5
parallel:
  n_jobs: 1
bmp_sel_prob_via_costs: False
bmp_fail_rate: 0.0
