# Demonstration only. AFO locations, animals, and manure concentrations are
# illustrative, NOT a verified East Fork inventory or validated input values.
verbose: True
random_seed: 42
outputs: ../../outputs/run_afo_demo
domain: ../domain/east_fork_domain.gpkg
parcels: ../parcels/parcels_ex2dot1_plet_based_load_gen_deterministic.gpkg
huc_parameters: ../hucs/huc12s_ex1dot1_plet_based_load_gen_deterministic.gpkg
